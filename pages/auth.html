<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TienHub — Đăng nhập</title>

    <link
        rel="icon"
        type="image/png"
        href="../assets/icon/tienhub-mark.png"
    >

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>


<body class="auth-page">


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="auth-background">

        <div class="auth-glow auth-glow-one"></div>
        <div class="auth-glow auth-glow-two"></div>

        <div class="auth-grid"></div>

    </div>



    <!-- =====================================================
         AUTH HEADER
    ====================================================== -->

    <header class="auth-header">

        <a
            href="../index.html"
            class="auth-brand"
            aria-label="TienHub"
        >

            <img
                src="../assets/icon/tienhub-mark.png"
                alt="TienHub"
            >

            <span>TienHub</span>

        </a>

    </header>



    <!-- =====================================================
         AUTH MAIN
    ====================================================== -->

    <main class="auth-main">


        <section
            class="auth-card"
            aria-label="Tài khoản TienHub"
        >


            <!-- TOP -->

            <div class="auth-card-top">

                <div class="auth-logo">

                    <img
                        src="../assets/icon/tienhub-mark.png"
                        alt=""
                    >

                </div>


                <h1
                    class="auth-title"
                    id="authTitle"
                >
                    Đăng nhập
                </h1>


                <p
                    class="auth-subtitle"
                    id="authSubtitle"
                >
                    Đăng nhập vào tài khoản TienHub của bạn.
                </p>

            </div>



            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                class="auth-form auth-form-login"
                id="loginForm"
                novalidate
            >


                <div class="auth-field">

                    <label
                        for="loginUsername"
                    >
                        Tên đăng nhập
                    </label>

                    <div class="auth-input-wrap">

                        <span class="auth-input-icon">
                            @
                        </span>

                        <input
                            id="loginUsername"
                            name="username"
                            type="text"
                            autocomplete="username"
                            placeholder="Nhập tên đăng nhập"
                            maxlength="20"
                            required
                        >

                    </div>

                </div>



                <div class="auth-field">

                    <div class="auth-label-row">

                        <label
                            for="loginPassword"
                        >
                            Mật khẩu
                        </label>

                    </div>


                    <div class="auth-input-wrap">

                        <span class="auth-input-icon">
                            •
                        </span>

                        <input
                            id="loginPassword"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Nhập mật khẩu"
                            required
                        >

                        <button
                            class="auth-password-toggle"
                            type="button"
                            data-target="loginPassword"
                            aria-label="Hiện mật khẩu"
                        >
                            Hiện
                        </button>

                    </div>

                </div>



                <p
                    class="auth-message"
                    id="loginMessage"
                    aria-live="polite"
                ></p>



                <button
                    class="auth-submit"
                    type="submit"
                >

                    <span>Đăng nhập</span>

                    <span class="auth-submit-arrow">
                        →
                    </span>

                </button>


            </form>



            <!-- =================================================
                 REGISTER FORM
            ================================================== -->

            <form
                class="auth-form auth-form-register"
                id="registerForm"
                novalidate
                hidden
            >


                <div class="auth-field">

                    <label
                        for="registerUsername"
                    >
                        Tên đăng nhập
                    </label>

                    <div class="auth-input-wrap">

                        <span class="auth-input-icon">
                            @
                        </span>

                        <input
                            id="registerUsername"
                            name="username"
                            type="text"
                            autocomplete="username"
                            placeholder="Chọn tên đăng nhập"
                            maxlength="20"
                            required
                        >

                    </div>

                    <small class="auth-hint">
                        3–20 ký tự, chỉ gồm chữ, số và dấu gạch dưới.
                    </small>

                </div>



                <div class="auth-field">

                    <label
                        for="registerPassword"
                    >
                        Mật khẩu
                    </label>

                    <div class="auth-input-wrap">

                        <span class="auth-input-icon">
                            •
                        </span>

                        <input
                            id="registerPassword"
                            name="password"
                            type="password"
                            autocomplete="new-password"
                            placeholder="Tạo mật khẩu"
                            required
                        >

                        <button
                            class="auth-password-toggle"
                            type="button"
                            data-target="registerPassword"
                            aria-label="Hiện mật khẩu"
                        >
                            Hiện
                        </button>

                    </div>

                    <small class="auth-hint">
                        Mật khẩu tối thiểu 6 ký tự.
                    </small>

                </div>



                <div class="auth-field">

                    <label
                        for="registerPasswordConfirm"
                    >
                        Nhập lại mật khẩu
                    </label>

                    <div class="auth-input-wrap">

                        <span class="auth-input-icon">
                            •
                        </span>

                        <input
                            id="registerPasswordConfirm"
                            name="passwordConfirm"
                            type="password"
                            autocomplete="new-password"
                            placeholder="Nhập lại mật khẩu"
                            required
                        >

                        <button
                            class="auth-password-toggle"
                            type="button"
                            data-target="registerPasswordConfirm"
                            aria-label="Hiện mật khẩu"
                        >
                            Hiện
                        </button>

                    </div>

                </div>



                <p
                    class="auth-message"
                    id="registerMessage"
                    aria-live="polite"
                ></p>



                <button
                    class="auth-submit"
                    type="submit"
                >

                    <span>Đăng ký</span>

                    <span class="auth-submit-arrow">
                        →
                    </span>

                </button>


            </form>



            <!-- =================================================
                 SWITCH
            ================================================== -->

            <div class="auth-switch">

                <span id="switchText">
                    Chưa có tài khoản?
                </span>

                <button
                    type="button"
                    id="switchAuth"
                >
                    Đăng ký
                </button>

            </div>



            <!-- =================================================
                 SECURITY NOTE
            ================================================== -->

            <div class="auth-security">

                <span class="auth-security-icon">
                    🔒
                </span>

                <span>
                    Tài khoản TienHub được bảo vệ an toàn.
                </span>

            </div>


        </section>

    </main>



    <!-- =====================================================
         AUTH SCRIPT
    ====================================================== -->

    <script src="../js/auth.js?v=20260926-1418"></script>

</body>

</html>
