<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TienHub Snake</title>
    <meta name="description" content="TienHub Snake - mini game classic snake game.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-shell">
        <header class="topbar">
            <a class="brand" href="../../index.html" aria-label="Back to TienHub">
                <span class="brand-dot"></span>
                <span>TienHub</span>
            </a>
            <div class="top-actions">
                <button id="soundBtn" class="icon-btn" type="button" aria-label="Toggle Sound">🔊</button>
                <a class="back-btn" href="../../index.html">← TienHub</a>
            </div>
        </header>

        <section class="game-header">
            <div>
                <p class="eyebrow">MINI GAME</p>
                <h1>Snake</h1>
            </div>
            <div class="stats">
                <div class="stat">
                    <span>Score</span>
                    <strong id="score">0</strong>
                </div>
                <div class="stat">
                    <span>High Score</span>
                    <strong id="highScore">0</strong>
                </div>
                <div class="stat time-stat">
                    <span>Time</span>
                    <strong id="gameTime">00:00</strong>
                </div>
            </div>
        </section>

        <section class="game-layout">
            <aside class="leaderboard-panel panel-card" aria-label="Leaderboard Snake">
                <div class="panel-heading">
                    <div>
                        <p class="panel-kicker">LEADERBOARD</p>
                        <h2>Top 10</h2>
                    </div>
                    <span class="panel-badge">🏆</span>
                </div>
                <div id="leaderboardList" class="leaderboard-list">
                    <div class="leaderboard-empty">No leaderboard data yet.</div>
                </div>
            </aside>

            <section class="game-area">
                <div class="board-wrap">
                <canvas id="gameCanvas" width="600" height="600" aria-label="Snake board"></canvas>

                <div id="overlay" class="overlay">
                    <div class="overlay-card">
                        <div id="overlayIcon" class="overlay-icon">🐍</div>
                        <h2 id="overlayTitle">Snake</h2>
                        <p id="overlayText">Ready to play?</p>
                        <button id="mainBtn" class="primary-btn" type="button">▶ Play</button>
                    </div>
                </div>
                </div>

                <div class="controls">
                <button id="pauseBtn" class="secondary-btn" type="button">⏸ Pause</button>
                <button id="restartBtn" class="secondary-btn" type="button">↻ Play Again</button>
            </div>

            <div class="mobile-controls" aria-label="Touch controls">
                <button data-dir="up" type="button">▲</button>
                <div>
                    <button data-dir="left" type="button">◀</button>
                    <button data-dir="down" type="button">▼</button>
                    <button data-dir="right" type="button">▶</button>
                </div>
            </div>

                <p class="hint">WASD / ↑ ↓ ← → to move · Space to pause · R to restart</p>
            </section>

            <aside class="personal-panel panel-card" aria-label="Your performance">
                <div class="panel-heading">
                    <div>
                        <p class="panel-kicker">YOUR RANKING</p>
                        <h2>Performance</h2>
                    </div>
                    <span class="panel-badge">👤</span>
                </div>

                <div class="personal-stat primary">
                    <span>High Score</span>
                    <strong id="myHighScore">0</strong>
                </div>
                <div class="personal-stat">
                    <span>Record Time</span>
                    <strong id="myBestTime">—</strong>
                </div>
                <div class="personal-stat">
                    <span>Current Rank</span>
                    <strong id="myRank">—</strong>
                </div>
            </aside>
        </section>
    </main>

    <
<script type="module" src="game.js"></script>
</body>
</html>
